name: Trigger auto deployment for e3i-portal-test

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/e3i-portal-test-AutoDeployTrigger-6a7eb49d-e949-47a3-ac7b-d20a5b53b190.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.E3IPORTALTEST_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.E3IPORTALTEST_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.E3IPORTALTEST_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: acre3i431811.azurecr.io
          registryUsername: ${{ secrets.E3IPORTALTEST_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.E3IPORTALTEST_REGISTRY_PASSWORD }}
          containerAppName: e3i-portal-test
          resourceGroup: rg-e3i-portal-test
          imageToBuild: acre3i431811.azurecr.io/e3i-portal-test:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


