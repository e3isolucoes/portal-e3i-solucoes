name: AWS Staging Drift Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/aws-staging-drift-diagnose.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: aws-staging
    steps:
      - uses: actions/checkout@v7
      - name: Authenticate to AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          role-session-name: github-painel-drift-diagnose
          aws-region: sa-east-1
          allowed-account-ids: '181215701228'
          unset-current-credentials: true
      - name: Inspect immutable Cognito schema and stack drift
        shell: bash
        run: |
          set -euo pipefail
          STACK="e3i-staging-painel-obrigacoes"
          REGION="sa-east-1"
          POOL_ID="$(aws cloudformation describe-stack-resource             --stack-name "$STACK"             --logical-resource-id UserPool             --region "$REGION"             --query 'StackResourceDetail.PhysicalResourceId'             --output text)"

          echo "=== USER POOL ==="
          echo "$POOL_ID"
          echo "=== COGNITO SCHEMA ==="
          aws cognito-idp describe-user-pool             --user-pool-id "$POOL_ID"             --region "$REGION"             --query 'UserPool.SchemaAttributes[].{Name:Name,Type:AttributeDataType,Mutable:Mutable,Required:Required,StringMin:StringAttributeConstraints.MinLength,StringMax:StringAttributeConstraints.MaxLength}'             --output json

          echo "=== ORIGINAL STACK TEMPLATE ==="
          if aws cloudformation get-template             --stack-name "$STACK"             --region "$REGION"             --template-stage Original             --query 'TemplateBody'             --output text > /tmp/current-stack-template.yaml; then
            echo "=== USERPOOL / PRETOKEN EXCERPT ==="
            sed -n '105,480p' /tmp/current-stack-template.yaml
            echo "=== ENTITLEMENT EXCERPT ==="
            sed -n '655,790p' /tmp/current-stack-template.yaml
            echo "=== PARAMETERS / OUTPUTS EXCERPT ==="
            sed -n '1,105p' /tmp/current-stack-template.yaml
            sed -n '1450,1525p' /tmp/current-stack-template.yaml
          else
            echo "GET_TEMPLATE_NOT_ALLOWED"
          fi

          echo "=== DEPLOYED HANDLER EXCERPTS ==="
          for FUNCTION_NAME in             "e3i-staging-painel-obrigacoes-pre-token"             "e3i-staging-painel-obrigacoes-entitlement-lifecycle"
          do
            echo "--- $FUNCTION_NAME ---"
            LOCATION="$(aws lambda get-function               --function-name "$FUNCTION_NAME"               --region "$REGION"               --query 'Code.Location'               --output text 2>/dev/null || true)"
            if [ -z "$LOCATION" ] || [ "$LOCATION" = "None" ]; then
              echo "LAMBDA_GET_FUNCTION_NOT_ALLOWED_OR_MISSING"
              continue
            fi
            ZIP="/tmp/${FUNCTION_NAME}.zip"
            curl -fsSL "$LOCATION" -o "$ZIP"
            unzip -l "$ZIP" | sed -n '1,100p'
            if [[ "$FUNCTION_NAME" == *"-pre-token" ]]; then
              TARGET="pre-token-generation.js"
            else
              TARGET="entitlements.js"
            fi
            if ! unzip -Z1 "$ZIP" | grep -Fxq "$TARGET"; then
              echo "HANDLER_BUNDLE_NOT_FOUND"
              continue
            fi
            OUT="/tmp/$(basename "$TARGET")"
            unzip -p "$ZIP" "$TARGET" > "$OUT"
            START="$(grep -nE '// src/(pre-token-generation|entitlements)\.mjs' "$OUT" | head -n1 | cut -d: -f1 || true)"
            if [ -n "$START" ]; then
              END=$((START + 360))
              sed -n "${START},${END}p" "$OUT"
            else
              tail -n 420 "$OUT"
            fi
          done
